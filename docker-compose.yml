services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
       DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
       TEST_DATABASE_URL: postgresql+psycopg://specula_test:specula_test_password@test_db:5432/specula_test
    volumes:
      - .:/app

  db:
    image: postgres:17
    environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
  
  test_db:
    image: postgres:17
    environment:
      POSTGRES_USER: specula_test
      POSTGRES_PASSWORD: specula_test_password
      POSTGRES_DB: specula_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
